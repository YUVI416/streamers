<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>LUCAS CHEATS — Cloud Control</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#000;color:#fff;font-family:'Rajdhani',sans-serif;overflow:hidden;}
canvas#bg{position:fixed;inset:0;z-index:0;}
.fx{position:fixed;inset:0;z-index:1;pointer-events:none;}
.fx-grid{background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:52px 52px;position:absolute;inset:0;}
.fx-vig{background:radial-gradient(ellipse 110% 110% at 50% 50%,transparent 35%,rgba(0,0,0,.9) 100%);position:absolute;inset:0;}
.fx-scan{background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(0,0,0,.09) 3px,rgba(0,0,0,.09) 4px);position:absolute;inset:0;}
.fx-beam{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);animation:beam 5.5s linear infinite;}
@keyframes beam{from{top:-2px;}to{top:100vh;}}
.page{display:none;position:fixed;inset:0;z-index:10;align-items:center;justify-content:center;}
.page.active{display:flex;}
.card{
  position:relative;background:rgba(5,5,5,.97);border:1px solid rgba(255,255,255,.1);border-radius:4px;
  padding:2.4rem 2.6rem 2rem;width:430px;text-align:center;
  animation:cin .5s cubic-bezier(.16,1,.3,1) forwards;
  box-shadow:0 0 0 1px rgba(255,255,255,.04),0 50px 120px rgba(0,0,0,1),inset 0 1px 0 rgba(255,255,255,.07);
  transition:transform .08s ease,box-shadow .3s;
}
.card-w{width:470px;}
.card::before{content:'';position:absolute;top:0;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65) 50%,transparent);}
.card::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);}
@keyframes cin{from{opacity:0;transform:translateY(-35px) rotateX(14deg) scale(.95);}to{opacity:1;transform:translateY(0) rotateX(0) scale(1);}}
.cc{position:absolute;width:14px;height:14px;border-color:rgba(255,255,255,.22);border-style:solid;}
.cc.tl{top:8px;left:8px;border-width:1px 0 0 1px;}
.cc.tr{top:8px;right:8px;border-width:1px 1px 0 0;}
.cc.bl{bottom:8px;left:8px;border-width:0 0 1px 1px;}
.cc.br{bottom:8px;right:8px;border-width:0 1px 1px 0;}
.ctag{position:absolute;top:10px;right:14px;font-family:'JetBrains Mono',monospace;font-size:.45rem;letter-spacing:2px;color:rgba(255,255,255,.12);}
.lw{margin-bottom:1.5rem;display:flex;flex-direction:column;align-items:center;}
.limg{width:100px;height:100px;object-fit:cover;border-radius:50%;border:1px solid rgba(255,255,255,.18);margin-bottom:1rem;
  filter:drop-shadow(0 0 22px rgba(255,255,255,.18));transition:filter .4s,transform .4s;}
.limg:hover{filter:drop-shadow(0 0 44px rgba(255,255,255,.55));transform:scale(1.06) rotate(-3deg);}
.lt{font-family:'Orbitron',sans-serif;font-size:1.25rem;font-weight:900;letter-spacing:7px;color:#fff;text-transform:uppercase;
  text-shadow:0 0 28px rgba(255,255,255,.22);animation:glitch 9s infinite;}
@keyframes glitch{
  0%,88%,100%{text-shadow:0 0 25px rgba(255,255,255,.22);transform:translate(0);}
  90%{text-shadow:-2px 0 rgba(255,255,255,.7),2px 0 rgba(255,255,255,.3);transform:translate(-1px,0);}
  92%{text-shadow:2px 0 rgba(255,255,255,.7),-2px 0 rgba(255,255,255,.3);transform:translate(1px,0);}
  94%{text-shadow:0 0 25px rgba(255,255,255,.22);transform:translate(0);}
  96%{text-shadow:-1px 0 rgba(255,255,255,.5);transform:translate(-1px,0);}
  98%{text-shadow:0 0 25px rgba(255,255,255,.22);transform:translate(0);}
}
.ls{font-size:.55rem;color:rgba(255,255,255,.22);letter-spacing:5px;margin-top:4px;text-transform:uppercase;font-family:'JetBrains Mono',monospace;}
.lb{width:55px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);margin:10px auto 0;}
.hint{font-size:.6rem;color:rgba(255,255,255,.17);line-height:2.2;margin-bottom:1.3rem;font-family:'JetBrains Mono',monospace;}
.ig{margin-bottom:.85rem;text-align:left;}
.ig label{display:block;font-size:.52rem;font-weight:700;color:rgba(255,255,255,.28);letter-spacing:3.5px;text-transform:uppercase;margin-bottom:7px;font-family:'JetBrains Mono',monospace;}
.ig input{width:100%;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);border-radius:2px;padding:13px 16px;
  font-family:'JetBrains Mono',monospace;font-size:.9rem;color:#fff;outline:none;transition:border-color .25s,background .25s,box-shadow .25s;}
.ig input:focus{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.055);box-shadow:0 0 0 3px rgba(255,255,255,.04),0 0 28px rgba(255,255,255,.05);}
.ig input::placeholder{color:rgba(255,255,255,.1);}
.btn{cursor:pointer;width:100%;background:#fff;color:#000;border:none;padding:14px 28px;margin-top:.85rem;
  font-family:'Orbitron',sans-serif;font-size:.62rem;font-weight:700;border-radius:2px;letter-spacing:3px;text-transform:uppercase;
  transition:all .22s;position:relative;overflow:hidden;
  box-shadow:0 4px 28px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.85);-webkit-tap-highlight-color:transparent;}
.btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,0,0,.07),transparent);transition:left .5s;}
.btn:hover::after,.btn:active::after{left:100%;}
.btn:hover{background:rgba(238,238,238,1);transform:translateY(-2px);box-shadow:0 14px 45px rgba(255,255,255,.22),inset 0 1px 0 rgba(255,255,255,.9);}
.btn:active{transform:translateY(0) scale(.985);box-shadow:none;}
.btn:disabled{opacity:.2;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-o{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.15);box-shadow:none;}
.btn-o:hover{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.4);transform:translateY(-2px);}
.btn-d{background:transparent;color:#ff2929;border:1px solid rgba(255,41,41,.3);box-shadow:none;}
.btn-d:hover{background:rgba(255,41,41,.08);border-color:#ff2929;box-shadow:0 0 28px rgba(255,41,41,.1);transform:translateY(-2px);}
.bg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:1.3rem;}
.bg .btn,.bg .btn-o{width:auto;font-size:.52rem;padding:12px 8px;margin-top:0;letter-spacing:1.5px;}
.bfl{grid-column:1/-1;}
.asel{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:0;}
.asel .abtn{cursor:pointer;background:transparent;color:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.12);border-radius:2px;padding:10px 8px;font-family:'Orbitron',sans-serif;font-size:.5rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;transition:all .22s;}
.asel .abtn.active{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.55);box-shadow:0 0 18px rgba(255,255,255,.08);}
.asel .abtn:hover:not(.active){background:rgba(255,255,255,.035);color:rgba(255,255,255,.65);border-color:rgba(255,255,255,.25);}
.asel-label{font-size:.46rem;letter-spacing:3px;color:rgba(255,255,255,.2);text-transform:uppercase;font-family:'JetBrains Mono',monospace;margin-bottom:6px;margin-top:1.1rem;text-align:left;}
/* ── Mode Tabs ── */
.mtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:1.2rem;}
.mtab{cursor:pointer;background:transparent;color:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.1);border-radius:3px;padding:9px 4px;font-family:'Orbitron',sans-serif;font-size:.42rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;transition:all .22s;position:relative;overflow:hidden;}
.mtab::after{content:'';position:absolute;bottom:0;left:50%;right:50%;height:2px;background:#fff;transition:left .25s,right .25s;}
.mtab.active{background:rgba(255,255,255,.07);color:#fff;border-color:rgba(255,255,255,.45);}
.mtab.active::after{left:0;right:0;}
.mtab:hover:not(.active){background:rgba(255,255,255,.03);color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.2);}
.mpanel{display:none;animation:mfade .3s ease;}
.mpanel.active{display:block;}
@keyframes mfade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.coming{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 0 1rem;gap:.6rem;}
.coming-icon{font-size:2rem;opacity:.15;}
.coming-txt{font-family:'JetBrains Mono',monospace;font-size:.55rem;letter-spacing:3px;color:rgba(255,255,255,.18);text-transform:uppercase;}
.coming-sub{font-family:'JetBrains Mono',monospace;font-size:.45rem;letter-spacing:2px;color:rgba(255,255,255,.1);text-transform:uppercase;}
.smsg{margin-top:.85rem;font-size:.62rem;font-family:'JetBrains Mono',monospace;color:rgba(255,255,255,.28);min-height:1.1rem;transition:all .3s;}
.err{font-size:.62rem;color:#ff2929;margin-top:.5rem;display:none;font-family:'JetBrains Mono',monospace;}
.err.show{display:block;}
.sbox{position:relative;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:2px;padding:14px;margin-bottom:1.3rem;}
.sbox::before{content:'';position:absolute;top:0;left:15%;right:15%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);}
.slb{font-size:.5rem;letter-spacing:4px;color:rgba(255,255,255,.2);text-transform:uppercase;font-family:'JetBrains Mono',monospace;}
.scd{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:700;color:#fff;letter-spacing:6px;margin-top:5px;text-shadow:0 0 22px rgba(255,255,255,.35);}
.cst{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;font-size:.55rem;letter-spacing:2.5px;color:rgba(255,255,255,.28);font-family:'JetBrains Mono',monospace;}
.dot{width:6px;height:6px;border-radius:50%;background:#222;transition:all .3s;}
.dot.on{background:#fff;box-shadow:0 0 12px rgba(255,255,255,.9);animation:dp 2s infinite;}
.dot.off{background:#ff2929;box-shadow:0 0 10px rgba(255,41,41,.6);}
@keyframes dp{0%,100%{opacity:1;box-shadow:0 0 12px rgba(255,255,255,.9);}50%{opacity:.3;box-shadow:0 0 4px rgba(255,255,255,.2);}}
.sp{display:inline-block;width:12px;height:12px;border:2px solid rgba(0,0,0,.1);border-top:2px solid #000;border-radius:50%;animation:spn .6s linear infinite;vertical-align:middle;margin-right:7px;}
.btn-o .sp,.btn-d .sp{border-color:rgba(255,255,255,.1);border-top-color:#fff;}
@keyframes spn{to{transform:rotate(360deg);}}
#cst2{margin-top:.85rem;font-size:.62rem;font-family:'JetBrains Mono',monospace;color:rgba(255,255,255,.32);min-height:1.1rem;transition:all .3s;}
@media(max-width:480px){
  .card,.card-w{width:95vw;padding:1.8rem 1.3rem 1.5rem;}
  .lt{font-size:1rem;letter-spacing:4px;}
  .limg{width:80px;height:80px;}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="fx"><div class="fx-grid"></div><div class="fx-vig"></div><div class="fx-scan"></div><div class="fx-beam"></div></div>

<div class="page active" id="pg-code">
  <div class="card" id="c1">
    <div class="cc tl"></div><div class="cc tr"></div><div class="cc bl"></div><div class="cc br"></div>
    <span class="ctag">v2.0</span>
    <div class="lw">
      <img src="logo.jpg" alt="LUCAS CHEATS" class="limg"/>
      <div class="lt">LUCAS CHEATS</div>
      <div class="ls">Cloud Control System</div>
      <div class="lb"></div>
    </div>
    <p class="hint">Run the EXE &bull; Login in terminal<br>Session code appears &bull; Enter below</p>
    <div class="ig">
      <label>Session Code</label>
      <input type="text" id="sci" placeholder="LC-XXXXXX" autocomplete="off" spellcheck="false" inputmode="text"
        style="text-transform:uppercase;letter-spacing:6px;font-size:1rem;text-align:center;"/>
    </div>
    <p class="err" id="ce">Invalid code or EXE not running</p>
    <button class="btn" id="cb" onclick="go()">Connect to EXE</button>
    <div class="smsg" id="sm"></div>
  </div>
</div>

<div class="page" id="pg-ctrl">
  <div class="card card-w" id="c2">
    <div class="cc tl"></div><div class="cc tr"></div><div class="cc bl"></div><div class="cc br"></div>
    <span class="ctag">LIVE</span>
    <div class="lw">
      <img src="logo.jpg" alt="LUCAS CHEATS" class="limg" style="width:76px;height:76px;"/>
      <div class="lt">LUCAS CHEATS</div>
      <div class="ls">Remote Control Panel</div>
      <div class="lb"></div>
    </div>
    <div class="sbox">
      <div class="slb">Active Session</div>
      <div class="scd" id="acd">—</div>
      <div class="cst"><span class="dot on" id="cd"></span><span id="cl">CONNECTED</span></div>
    </div>
    <!-- ══ Mode Tabs ══ -->
    <div class="mtabs">
      <button class="mtab active" id="mt-aimbot" onclick="switchMode('aimbot')">⊕ Aimbot</button>
      <button class="mtab" id="mt-location" onclick="switchMode('location')">◉ Location</button>
      <button class="mtab" id="mt-sniper" onclick="switchMode('sniper')">◎ Sniper</button>
      <button class="mtab" id="mt-extra" onclick="switchMode('extra')">✦ Extra</button>
    </div>

    <!-- ══ Panel: Aimbot ══ -->
    <div class="mpanel active" id="mp-aimbot">
      <div class="asel-label">Select Aimbot</div>
      <div class="asel">
        <button class="abtn active" id="abtn-drag" onclick="selectAimbot('drag')">⊕ Aimbot Drag</button>
        <button class="abtn" id="abtn-head" onclick="selectAimbot('head')">◎ Aimbot Head</button>
      </div>
      <div class="bg">
        <button class="btn" onclick="cmdAimbot('load')">Load Aimbot</button>
        <button class="btn btn-o" onclick="cmdAimbot('toggle')">Toggle</button>
        <button class="btn btn-o bfl" onclick="cmdAimbot('bind')">Bind Key</button>
      </div>
    </div>

    <!-- ══ Panel: Location ══ -->
    <div class="mpanel" id="mp-location">
      <div class="bg" style="margin-top:.8rem;">
        <button class="btn bfl" onclick="cmd('location')">Chams Menu</button>
      </div>
    </div>

    <!-- ══ Panel: Sniper ══ -->
    <div class="mpanel" id="mp-sniper">
      <div class="coming">
        <div class="coming-icon">◎</div>
        <div class="coming-txt">Sniper Mode</div>
        <div class="coming-sub">Coming Soon</div>
      </div>
    </div>

    <!-- ══ Panel: Extra ══ -->
    <div class="mpanel" id="mp-extra">
      <div class="coming">
        <div class="coming-icon">✦</div>
        <div class="coming-txt">Extra Mode</div>
        <div class="coming-sub">Coming Soon</div>
      </div>
    </div>

    <!-- ══ Always visible ══ -->
    <button class="btn btn-d" style="width:100%;margin-top:1rem;" onclick="cmd('exit')">Exit EXE</button>
    <div id="cst2">—</div>
  </div>
</div>

<script>
(function(){
  var cv=document.getElementById('bg'),cx=cv.getContext('2d'),W,H,P=[];
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  function mk(){P=[];for(var i=0;i<110;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.1+.2,a:Math.random()*.45+.08});}
  function dr(){
    cx.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){
      var p=P[i];p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      for(var j=i+1;j<P.length;j++){
        var q=P[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<105){cx.beginPath();cx.strokeStyle='rgba(255,255,255,'+(.055*(1-d/105))+')';cx.lineWidth=.4;cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke();}
      }
      cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fillStyle='rgba(255,255,255,'+p.a+')';cx.fill();
    }
    requestAnimationFrame(dr);
  }
  window.addEventListener('resize',function(){rs();mk();});
  rs();mk();dr();

  function tilt(el){
    function mv(e){
      var r=el.getBoundingClientRect(),cx2,cy2;
      if(e.touches){cx2=e.touches[0].clientX;cy2=e.touches[0].clientY;}
      else{cx2=e.clientX;cy2=e.clientY;}
      var rx=(cy2-r.top-r.height/2)/r.height*13,ry=(cx2-r.left-r.width/2)/r.width*-13;
      el.style.transform='perspective(1100px) rotateX('+rx+'deg) rotateY('+ry+'deg) scale(1.022)';
    }
    function rs2(){el.style.transform='perspective(1100px) rotateX(0) rotateY(0) scale(1)';}
    el.addEventListener('mousemove',mv);
    el.addEventListener('touchmove',mv,{passive:true});
    el.addEventListener('mouseleave',rs2);
    el.addEventListener('touchend',rs2);
  }
  document.querySelectorAll('.card').forEach(tilt);
})();

var RL='wss://lucas-cheats-relay.onrender.com',ws=null,sc=null;

function show(id){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});document.getElementById(id).classList.add('active');}

function go(){
  var code=document.getElementById('sci').value.trim().toUpperCase();
  if(!code)return;
  var btn=document.getElementById('cb'),sm=document.getElementById('sm'),ce=document.getElementById('ce');
  btn.disabled=true;btn.innerHTML='<span class="sp"></span>Connecting...';
  ce.classList.remove('show');sm.textContent='';
  ws=new WebSocket(RL);var ok=false;
  var t=setTimeout(function(){if(!ok){ws.close();ce.textContent='Connection failed';ce.classList.add('show');btn.disabled=false;btn.textContent='Connect to EXE';}},8000);
  ws.onopen=function(){ok=true;clearTimeout(t);ws.send(JSON.stringify({type:'join_web',code:code}));sm.textContent='Waiting for EXE...';};
  ws.onmessage=function(e){
    try{
      var m=JSON.parse(e.data);
      if(m.type==='connected'){sc=code;document.getElementById('acd').textContent=code;show('pg-ctrl');btn.disabled=false;btn.textContent='Connect to EXE';}
      else if(m.type==='error'){ce.textContent=''+m.message;ce.classList.add('show');btn.disabled=false;btn.textContent='Connect to EXE';ws.close();}
      else if(m.type==='response'){var el=document.getElementById('cst2');el.style.color='#fff';el.textContent=''+m.text;setTimeout(function(){el.style.color='rgba(255,255,255,.32)';},3000);}
    }catch(x){}
  };
  ws.onclose=function(){
    var d=document.getElementById('cd'),l=document.getElementById('cl');
    if(d&&d.classList.contains('on')){d.className='dot off';l.textContent='DISCONNECTED';document.getElementById('cst2').textContent='Connection lost';}
  };
}

document.getElementById('sci').addEventListener('keydown',function(e){if(e.key==='Enter')go();});

var activeAimbot='drag';
var activeMode='aimbot';

function switchMode(mode){
  activeMode=mode;
  var modes=['aimbot','location','sniper','extra'];
  modes.forEach(function(m){
    document.getElementById('mt-'+m).classList.toggle('active',m===mode);
    document.getElementById('mp-'+m).classList.toggle('active',m===mode);
  });
  document.getElementById('cst2').textContent='Mode: '+mode.charAt(0).toUpperCase()+mode.slice(1);
}


function selectAimbot(type){
  activeAimbot=type;
  document.getElementById('abtn-drag').classList.toggle('active',type==='drag');
  document.getElementById('abtn-head').classList.toggle('active',type==='head');
  document.getElementById('cst2').textContent='Selected: Aimbot '+(type==='head'?'Head':'Drag');
}

function cmdAimbot(base){
  var action=(activeAimbot==='head'&&base!=='location'&&base!=='exit')?(base+'head'):base;
  cmd(action);
}

function cmd(a){
  if(!ws||ws.readyState!==WebSocket.OPEN){document.getElementById('cst2').textContent='Not connected';return;}
  ws.send(JSON.stringify({type:'command',action:a}));
  document.getElementById('cst2').textContent='Sending '+a+'...';
}
</script>
</body>
</html>
