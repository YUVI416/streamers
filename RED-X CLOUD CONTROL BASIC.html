<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LUCAS CHEATS - Cloud Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: #000000;
      color: #ffffff;
      overflow: hidden;
    }

    /* ─── GRID BACKGROUND ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    /* Radial glow center */
    body::after {
      content: '';
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 700px; height: 700px;
      background: radial-gradient(ellipse, rgba(255,255,255,0.04) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    /* ─── PAGES ─── */
    .page {
      display: none;
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .page.active { display: flex; }

    /* ─── CARD ─── */
    .card {
      background: rgba(10, 10, 10, 0.95);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 2.8rem 2.5rem;
      width: 420px;
      text-align: center;
      animation: slideUp 0.35s cubic-bezier(0.16,1,0.3,1);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05),
        0 25px 80px rgba(0,0,0,0.8),
        0 0 60px rgba(255,255,255,0.03);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ─── LOGO ─── */
    .logo-wrap { margin-bottom: 2rem; }
    .logo {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: #ffffff;
      text-transform: uppercase;
    }
    .logo-sub {
      font-size: 0.6rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 5px;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .logo-line {
      width: 40px; height: 2px;
      background: #fff;
      margin: 12px auto 0;
      border-radius: 2px;
    }

    /* ─── INPUTS ─── */
    .input-group {
      margin-bottom: 1rem;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 0.6rem;
      font-weight: 600;
      color: rgba(255,255,255,0.4);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .input-group input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 13px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      color: #fff;
      outline: none;
      transition: all 0.2s;
    }
    .input-group input:focus {
      border-color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.07);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.05);
    }
    .input-group input::placeholder {
      color: rgba(255,255,255,0.2);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ─── MAIN BUTTON ─── */
    .btn {
      cursor: pointer;
      width: 100%;
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 14px 28px;
      margin-top: 0.8rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .btn:hover {
      background: rgba(255,255,255,0.88);
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(255,255,255,0.15);
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

    /* ─── OUTLINE BUTTON ─── */
    .btn-outline {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .btn-outline:hover {
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.4);
      box-shadow: 0 4px 20px rgba(255,255,255,0.05);
    }

    /* ─── DANGER BUTTON ─── */
    .btn-danger {
      background: transparent;
      color: #ff4444;
      border: 1px solid rgba(255,68,68,0.4);
    }
    .btn-danger:hover {
      background: rgba(255,68,68,0.1);
      border-color: #ff4444;
      box-shadow: 0 4px 20px rgba(255,68,68,0.15);
    }

    /* ─── CONTROL GRID ─── */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 1.5rem;
    }
    .btn-grid .btn, .btn-grid .btn-outline {
      width: auto;
      font-size: 0.7rem;
      padding: 12px 10px;
      margin-top: 0;
      letter-spacing: 1.5px;
    }
    .btn-full { grid-column: 1 / -1; }

    /* ─── STATUS ─── */
    .status-msg {
      margin-top: 1rem;
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      color: rgba(255,255,255,0.4);
      min-height: 1.2rem;
      letter-spacing: 0.5px;
      transition: all 0.3s;
    }

    /* ─── ERROR MSG ─── */
    .error-msg {
      font-size: 0.72rem;
      color: #ff5555;
      margin-top: 0.6rem;
      display: none;
      font-family: 'JetBrains Mono', monospace;
    }
    .error-msg.show { display: block; }

    /* ─── SESSION BOX ─── */
    .session-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 1.5rem;
    }
    .session-box .label {
      font-size: 0.55rem;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
    }
    .session-box .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: 4px;
      margin-top: 4px;
    }

    /* ─── CONNECTION STATUS ─── */
    .conn-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 0.62rem;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.4);
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #444;
      transition: all 0.3s;
    }
    .dot.online {
      background: #fff;
      box-shadow: 0 0 8px rgba(255,255,255,0.6);
      animation: blink 2s infinite;
    }
    .dot.offline { background: #ff4444; box-shadow: 0 0 8px rgba(255,68,68,0.4); }
    @keyframes blink {
      0%,100% { opacity:1; } 50% { opacity:0.3; }
    }

    /* ─── SPINNER ─── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top: 2px solid #000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    .btn-outline .spinner,
    .btn-danger .spinner { border-color: rgba(255,255,255,0.2); border-top-color: #fff; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── DIVIDER ─── */
    .divider {
      display: flex; align-items: center; gap: 10px;
      margin: 1.2rem 0;
      color: rgba(255,255,255,0.15);
      font-size: 0.55rem;
      letter-spacing: 2px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }

    /* ─── CONTROL STATUS ─── */
    #control-status {
      margin-top: 1rem;
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      color: rgba(255,255,255,0.5);
      min-height: 1.2rem;
      transition: all 0.3s;
    }

    /* ─── HINT TEXT ─── */
    .hint {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.25);
      line-height: 1.8;
      margin-bottom: 1.5rem;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <!-- ════════════ PAGE 1: LICENSE ════════════ -->
  <div class="page active" id="page-login">
    <div class="card">
      <div class="logo-wrap">
        <div class="logo">LUCAS CHEATS</div>
        <div class="logo-sub">Cloud Control System</div>
        <div class="logo-line"></div>
      </div>

      <div class="input-group">
        <label>License Key</label>
        <input type="text" id="license-key" placeholder="XXXXX-XXXXX-XXXXX" autocomplete="off" spellcheck="false" />
      </div>

      <p class="error-msg" id="auth-error">Invalid license key</p>
      <button class="btn" id="auth-btn" onclick="doAuth()">Authenticate</button>
      <div class="status-msg" id="status-text"></div>
    </div>
  </div>

  <!-- ════════════ PAGE 2: SESSION CODE ════════════ -->
  <div class="page" id="page-code">
    <div class="card">
      <div class="logo-wrap">
        <div class="logo">LUCAS CHEATS</div>
        <div class="logo-sub">Enter Session Code</div>
        <div class="logo-line"></div>
      </div>

      <p class="hint">
        Run the EXE on your PC.<br>
        A session code will appear in the terminal.<br>
        Enter it below to connect remotely.
      </p>

      <div class="input-group">
        <label>Session Code</label>
        <input type="text" id="session-code-input" placeholder="LC-XXXXXX"
               autocomplete="off" spellcheck="false"
               style="text-transform:uppercase; letter-spacing:4px; font-size:1rem; text-align:center;" />
      </div>

      <p class="error-msg" id="code-error">Invalid code or EXE not running</p>
      <button class="btn" id="connect-btn" onclick="connectSession()">Connect to EXE</button>
      <div class="status-msg" id="status-text2"></div>
    </div>
  </div>

  <!-- ════════════ PAGE 3: CONTROL PANEL ════════════ -->
  <div class="page" id="page-control">
    <div class="card" style="width:460px;">
      <div class="logo-wrap">
        <div class="logo">LUCAS CHEATS</div>
        <div class="logo-sub">Remote Control</div>
        <div class="logo-line"></div>
      </div>

      <div class="session-box">
        <div class="label">Active Session</div>
        <div class="code" id="active-code">—</div>
        <div class="conn-status">
          <span class="dot online" id="conn-dot"></span>
          <span id="conn-label">CONNECTED</span>
        </div>
      </div>

      <div class="btn-grid">
        <button class="btn" onclick="sendCmd('load')">Load Aimbot</button>
        <button class="btn-outline btn" onclick="sendCmd('toggle')">Toggle</button>
        <button class="btn-outline btn" onclick="sendCmd('bind')">Bind Key</button>
        <button class="btn-outline btn" onclick="sendCmd('location')">Chams Menu</button>
        <button class="btn btn-danger btn-full" onclick="sendCmd('exit')">Exit EXE</button>
      </div>

      <div id="control-status">—</div>
    </div>
  </div>

  <script>
    // ─── CONFIG ───
    const RELAY_URL = 'wss://lucas-cheats-relay.onrender.com';
    const KEYAUTH_CONFIG = {
      ownerid: 'YOUR_OWNER_ID',
      appid:   'YOUR_APP_NAME',
      version: '1.0'
    };

    let ws = null;
    let sessionCode = null;

    // ─── PAGE NAV ───
    function showPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // ─── AUTH ───
    async function doAuth() {
      const key = document.getElementById('license-key').value.trim();
      if (!key) return;

      const authBtn  = document.getElementById('auth-btn');
      const statusEl = document.getElementById('status-text');
      const errorEl  = document.getElementById('auth-error');

      authBtn.disabled = true;
      authBtn.innerHTML = '<span class="spinner"></span>Authenticating...';
      errorEl.classList.remove('show');
      statusEl.textContent = '';

      // ── DEMO MODE (check FIRST before API) ──
      if (key.toUpperCase() === 'LC-DEMO') {
        statusEl.style.color = '#aaffaa';
        statusEl.textContent = '✓ Demo mode activated';
        authBtn.disabled = false;
        authBtn.innerHTML = 'Authenticate';
        setTimeout(() => showPage('page-code'), 700);
        return;
      }

      try {
        const res = await fetch('https://keyauth.win/api/1.2/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            type: 'license',
            key: key,
            ownerid: KEYAUTH_CONFIG.ownerid,
            name: KEYAUTH_CONFIG.appid,
            ver: KEYAUTH_CONFIG.version
          })
        });
        const data = await res.json();
        if (data.success) {
          statusEl.style.color = '#aaffaa';
          statusEl.textContent = '✓ Authenticated';
          setTimeout(() => showPage('page-code'), 700);
        } else {
          errorEl.textContent = '✗ ' + (data.message || 'Invalid license key');
          errorEl.classList.add('show');
        }
      } catch (err) {
        errorEl.textContent = '✗ Auth server unreachable';
        errorEl.classList.add('show');
      }

      authBtn.disabled = false;
      authBtn.innerHTML = 'Authenticate';
    }

    document.getElementById('license-key').addEventListener('keydown', e => {
      if (e.key === 'Enter') doAuth();
    });

    // ─── CONNECT SESSION ───
    function connectSession() {
      const code    = document.getElementById('session-code-input').value.trim().toUpperCase();
      if (!code) return;

      const btn      = document.getElementById('connect-btn');
      const statusEl = document.getElementById('status-text2');
      const errorEl  = document.getElementById('code-error');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Connecting...';
      errorEl.classList.remove('show');
      statusEl.textContent = '';

      ws = new WebSocket(RELAY_URL);
      let connected = false;

      const timeout = setTimeout(() => {
        if (!connected) {
          ws.close();
          errorEl.textContent = '✗ Relay server unreachable';
          errorEl.classList.add('show');
          btn.disabled = false;
          btn.innerHTML = 'Connect to EXE';
        }
      }, 8000);

      ws.onopen = () => {
        connected = true;
        clearTimeout(timeout);
        ws.send(JSON.stringify({ type: 'join_web', code }));
        statusEl.textContent = 'Waiting for EXE response...';
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'connected') {
            sessionCode = code;
            document.getElementById('active-code').textContent = code;
            showPage('page-control');
            btn.disabled = false;
            btn.innerHTML = 'Connect to EXE';
          } else if (msg.type === 'error') {
            errorEl.textContent = '✗ ' + msg.message;
            errorEl.classList.add('show');
            btn.disabled = false;
            btn.innerHTML = 'Connect to EXE';
            ws.close();
          } else if (msg.type === 'response') {
            const el = document.getElementById('control-status');
            el.style.color = '#ffffff';
            el.textContent = '→ ' + msg.text;
            setTimeout(() => { el.style.color = 'rgba(255,255,255,0.4)'; }, 3000);
          }
        } catch(e) {}
      };

      ws.onclose = () => {
        const dot   = document.getElementById('conn-dot');
        const label = document.getElementById('conn-label');
        if (dot && dot.classList.contains('online')) {
          dot.className   = 'dot offline';
          label.textContent = 'DISCONNECTED';
          document.getElementById('control-status').textContent = '⚠ Connection lost';
        }
      };
    }

    document.getElementById('session-code-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') connectSession();
    });

    // ─── SEND COMMAND ───
    function sendCmd(action) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        document.getElementById('control-status').textContent = '⚠ Not connected';
        return;
      }
      ws.send(JSON.stringify({ type: 'command', action }));
      document.getElementById('control-status').textContent = '→ Sending ' + action + '...';
    }
  </script>
</body>
</html>
