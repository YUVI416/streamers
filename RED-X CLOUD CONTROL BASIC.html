<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RED-X CLOUD CONTROL</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      height: 100%;
      font-family: 'Orbitron', sans-serif;
      background: #0a0a0a;
      color: #eee;
      overflow: hidden;
    }

    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: linear-gradient(135deg, #0d0000 0%, #1a0505 50%, #0d0000 100%);
    }

    /* ─── PAGES ─── */
    .page {
      display: none;
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .page.active { display: flex; }

    /* ─── CARD ─── */
    .card {
      background: rgba(15, 0, 0, 0.75);
      border: 1px solid rgba(229, 9, 20, 0.25);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      box-shadow:
        0 0 40px rgba(229, 9, 20, 0.15),
        0 0 80px rgba(229, 9, 20, 0.07),
        inset 0 0 20px rgba(229, 9, 20, 0.05);
      padding: 2.8rem 2.5rem;
      width: 420px;
      text-align: center;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── LOGO ─── */
    .logo {
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #e50914;
      text-shadow: 0 0 10px #e5091466, 0 0 30px #e5091433;
      margin-bottom: 0.3rem;
    }
    .logo-sub {
      font-size: 0.65rem;
      color: #ffffff44;
      letter-spacing: 4px;
      margin-bottom: 2rem;
    }

    /* ─── INPUTS ─── */
    .input-group {
      margin-bottom: 1.2rem;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 0.65rem;
      color: #ff4444aa;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
    }
    .input-group input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(229, 9, 20, 0.3);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      color: #fff;
      outline: none;
      transition: all 0.3s;
    }
    .input-group input:focus {
      border-color: #e50914;
      box-shadow: 0 0 15px rgba(229, 9, 20, 0.3);
      background: rgba(229, 9, 20, 0.05);
    }
    .input-group input::placeholder { color: #ffffff33; }

    /* ─── BUTTONS ─── */
    .btn {
      cursor: pointer;
      width: 100%;
      background: transparent;
      color: #ccc;
      border: 1.5px solid #e50914;
      padding: 13px 28px;
      margin-top: 0.5rem;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.25s ease;
      box-shadow: 0 0 10px rgba(229, 9, 20, 0.2);
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 30%, rgba(229,9,20,0.1) 100%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .btn:hover {
      background: rgba(229, 9, 20, 0.15);
      color: #fff;
      box-shadow: 0 0 25px rgba(229, 9, 20, 0.5), inset 0 0 10px rgba(229, 9, 20, 0.1);
      transform: translateY(-1px);
    }
    .btn:hover::before { opacity: 1; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ─── CONTROL BUTTONS (grid) ─── */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 1.5rem;
    }
    .btn-grid .btn {
      width: auto;
      font-size: 0.75rem;
      padding: 12px 10px;
      margin-top: 0;
    }
    .btn-danger {
      border-color: #ff2222;
      color: #ff6666;
    }
    .btn-danger:hover {
      background: rgba(255, 30, 30, 0.2);
      box-shadow: 0 0 25px rgba(255, 30, 30, 0.5);
    }
    .btn-success {
      border-color: #00ff88;
      color: #00ff88;
    }
    .btn-success:hover {
      background: rgba(0, 255, 136, 0.1);
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.3);
    }
    .btn-full { grid-column: 1 / -1; }

    /* ─── STATUS ─── */
    #status-text, #control-status {
      margin-top: 1.2rem;
      font-size: 0.8rem;
      min-height: 1.5rem;
      letter-spacing: 1px;
      transition: all 0.3s;
    }

    /* ─── SESSION CODE DISPLAY ─── */
    .session-info {
      background: rgba(229, 9, 20, 0.08);
      border: 1px solid rgba(229, 9, 20, 0.2);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 1.5rem;
      font-size: 0.7rem;
      color: #ffffff55;
      letter-spacing: 2px;
    }
    .session-info span {
      display: block;
      font-size: 1.1rem;
      color: #e50914;
      font-weight: 700;
      letter-spacing: 4px;
      text-shadow: 0 0 10px #e5091488;
    }

    /* ─── CONNECTION INDICATOR ─── */
    .conn-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333;
      margin-right: 6px;
      vertical-align: middle;
      transition: all 0.3s;
    }
    .conn-dot.online { background: #00ff88; box-shadow: 0 0 8px #00ff88; animation: pulse 2s infinite; }
    .conn-dot.offline { background: #ff3333; box-shadow: 0 0 8px #ff3333; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ─── LOADING SPINNER ─── */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #e5091433;
      border-top: 2px solid #e50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── DIVIDER ─── */
    .divider {
      display: flex; align-items: center; gap: 10px;
      margin: 1.2rem 0; color: #ffffff22; font-size: 0.6rem; letter-spacing: 2px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: rgba(229,9,20,0.15);
    }

    .error-msg { color: #ff4444; font-size: 0.75rem; margin-top: 0.5rem; display: none; }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
  <div id="particles-js"></div>

  <!-- ════════════════════════════ PAGE 1: KeyAuth Login ════════════════════════════ -->
  <div class="page active" id="page-login">
    <div class="card">
      <div class="logo">RED-X</div>
      <div class="logo-sub">CLOUD CONTROL SYSTEM</div>

      <div class="input-group">
        <label>LICENSE KEY</label>
        <input type="text" id="license-key" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off" />
      </div>

      <p class="error-msg" id="auth-error">❌ Invalid license key</p>
      <button class="btn" id="auth-btn" onclick="doAuth()">AUTHENTICATE</button>
      <div id="status-text" style="color:#e50914aa;"></div>
    </div>
  </div>

  <!-- ════════════════════════════ PAGE 2: Enter Session Code ════════════════════════════ -->
  <div class="page" id="page-code">
    <div class="card">
      <div class="logo">RED-X</div>
      <div class="logo-sub">ENTER SESSION CODE</div>

      <p style="font-size:0.7rem; color:#ffffff55; margin-bottom:1.5rem; line-height:1.8; letter-spacing:1px;">
        Run the EXE on your PC.<br>
        A session code will appear in the terminal.<br>
        Enter it below to connect.
      </p>

      <div class="input-group">
        <label>SESSION CODE</label>
        <input type="text" id="session-code-input" placeholder="RED-X-XXXXXX" autocomplete="off" 
               style="text-transform:uppercase; letter-spacing:3px; font-size:1.1rem; text-align:center;" />
      </div>

      <p class="error-msg" id="code-error">❌ Invalid code or EXE not running</p>
      <button class="btn" id="connect-btn" onclick="connectSession()">CONNECT TO EXE</button>
      <div id="status-text2" style="color:#e50914aa; margin-top:0.8rem; font-size:0.75rem;"></div>
    </div>
  </div>

  <!-- ════════════════════════════ PAGE 3: Control Panel ════════════════════════════ -->
  <div class="page" id="page-control">
    <div class="card" style="width:460px;">
      <div class="logo">RED-X</div>
      <div class="logo-sub">CLOUD CONTROL</div>

      <div class="session-info">
        SESSION
        <span id="active-code">—</span>
        <div style="margin-top:4px;">
          <span class="conn-dot online" id="conn-dot"></span>
          <span id="conn-label" style="font-size:0.65rem; letter-spacing:2px; color:#ffffff66;">CONNECTED</span>
        </div>
      </div>

      <div class="btn-grid">
        <button class="btn" onclick="sendCmd('load')">⚡ LOAD AIMBOT</button>
        <button class="btn" onclick="sendCmd('toggle')">🔄 TOGGLE</button>
        <button class="btn" onclick="sendCmd('bind')">🎯 BIND KEY</button>
        <button class="btn" onclick="sendCmd('location')">💉 CHAMS MENU</button>
        <button class="btn btn-danger btn-full" onclick="sendCmd('exit')">✕ EXIT EXE</button>
      </div>

      <div id="control-status" style="color:#e50914; text-align:center;">—</div>
    </div>
  </div>

  <script>
    // ─────────────────────────────────────────────────────────
    // CONFIG - RELAY SERVER URL (after deploying on Glitch)
    // ─────────────────────────────────────────────────────────
    // REPLACE THIS with your actual Glitch project URL:
    const RELAY_URL = 'wss://lucas-cheats-relay.onrender.com';

    // KeyAuth Config
    const KEYAUTH_CONFIG = {
      ownerid: 'YOUR_OWNER_ID',    // Your KeyAuth owner ID
      appid: 'YOUR_APP_ID',        // Your KeyAuth app ID
      version: '1.0'
    };

    let ws = null;
    let sessionCode = null;
    let authedUser = null;

    // ─── PAGE NAVIGATION ───
    function showPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // ─── KeyAuth Authentication ───
    async function doAuth() {
      const key = document.getElementById('license-key').value.trim();
      if (!key) return;

      const authBtn = document.getElementById('auth-btn');
      const statusEl = document.getElementById('status-text');
      const errorEl = document.getElementById('auth-error');

      authBtn.disabled = true;
      authBtn.innerHTML = '<span class="spinner"></span>AUTHENTICATING...';
      errorEl.classList.remove('show');
      statusEl.textContent = '';

      try {
        // KeyAuth API call
        const res = await fetch('https://keyauth.win/api/1.2/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            type: 'license',
            key: key,
            ownerid: KEYAUTH_CONFIG.ownerid,
            name: KEYAUTH_CONFIG.appid,
            ver: KEYAUTH_CONFIG.version
          })
        });

        const data = await res.json();

        if (data.success) {
          authedUser = data.info || {};
          statusEl.style.color = '#00ff88';
          statusEl.textContent = '✅ Authenticated!';
          setTimeout(() => showPage('page-code'), 800);
        } else {
          errorEl.textContent = '❌ ' + (data.message || 'Invalid license key');
          errorEl.classList.add('show');
        }
      } catch (err) {
        // DEMO MODE: if KeyAuth fails (CORS/network), bypass for testing
        // Remove this block in production!
        if (key.toUpperCase() === 'RED-X-DEMO') {
          authedUser = { username: 'demo' };
          statusEl.style.color = '#00ff88';
          statusEl.textContent = '✅ Demo mode!';
          setTimeout(() => showPage('page-code'), 800);
          authBtn.disabled = false;
          authBtn.innerHTML = 'AUTHENTICATE';
          return;
        }
        errorEl.textContent = '❌ Auth server unreachable. Use RED-X-DEMO for testing.';
        errorEl.classList.add('show');
      }

      authBtn.disabled = false;
      authBtn.innerHTML = 'AUTHENTICATE';
    }

    // ─── Enter to submit on license key ───
    document.getElementById('license-key').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doAuth();
    });

    // ─── Connect to session via relay ───
    function connectSession() {
      const code = document.getElementById('session-code-input').value.trim().toUpperCase();
      if (!code) return;

      const btn = document.getElementById('connect-btn');
      const statusEl = document.getElementById('status-text2');
      const errorEl = document.getElementById('code-error');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>CONNECTING...';
      errorEl.classList.remove('show');
      statusEl.textContent = '';

      // Connect to relay
      ws = new WebSocket(RELAY_URL);
      let connected = false;
      let timeout = setTimeout(() => {
        if (!connected) {
          ws.close();
          errorEl.textContent = '❌ Relay server unreachable';
          errorEl.classList.add('show');
          btn.disabled = false;
          btn.innerHTML = 'CONNECT TO EXE';
        }
      }, 8000);

      ws.onopen = () => {
        connected = true;
        clearTimeout(timeout);
        // Send join request
        ws.send(JSON.stringify({ type: 'join_web', code }));
        statusEl.textContent = '🔄 Waiting for EXE response...';
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);

          if (msg.type === 'connected') {
            sessionCode = code;
            document.getElementById('active-code').textContent = code;
            showPage('page-control');
            btn.disabled = false;
            btn.innerHTML = 'CONNECT TO EXE';
          }
          else if (msg.type === 'error') {
            errorEl.textContent = '❌ ' + msg.message;
            errorEl.classList.add('show');
            btn.disabled = false;
            btn.innerHTML = 'CONNECT TO EXE';
            ws.close();
          }
          else if (msg.type === 'response') {
            // Status update from EXE
            const el = document.getElementById('control-status');
            el.textContent = msg.text;
            el.style.color = '#00ff88';
            setTimeout(() => el.style.color = '#e50914', 2000);
          }
        } catch(e) {}
      };

      ws.onclose = () => {
        // If already on control page, show disconnected
        const dot = document.getElementById('conn-dot');
        const label = document.getElementById('conn-label');
        if (dot) {
          dot.className = 'conn-dot offline';
          label.textContent = 'DISCONNECTED';
          document.getElementById('control-status').textContent = '⚠️ Connection lost';
        }
      };
    }

    // ─── Enter to submit session code ───
    document.getElementById('session-code-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') connectSession();
    });

    // ─── Send command to EXE ───
    function sendCmd(action) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        document.getElementById('control-status').textContent = '⚠️ Not connected';
        return;
      }
      ws.send(JSON.stringify({ type: 'command', action }));
      document.getElementById('control-status').textContent = `⚡ Sent: ${action.toUpperCase()}...`;
    }

    // ─── Particles ───
    particlesJS('particles-js', {
      particles: {
        number: { value: 200, density: { enable: true, value_area: 900 } },
        color: { value: '#ff0000' },
        shape: { type: 'circle' },
        opacity: { value: 0.5, random: true },
        size: { value: 3, random: true },
        line_linked: {
          enable: true, distance: 110,
          color: '#ff0000', opacity: 0.4, width: 1
        },
        move: { enable: true, speed: 2, random: true, bounce: false }
      },
      interactivity: {
        detect_on: 'canvas',
        events: {
          onhover: { enable: true, mode: 'repulse' },
          onclick: { enable: true, mode: 'push' },
          resize: true
        },
        modes: { repulse: { distance: 60, duration: 0.5 }, push: { particles_nb: 3 } }
      },
      retina_detect: true
    });
  </script>
</body>
</html>
